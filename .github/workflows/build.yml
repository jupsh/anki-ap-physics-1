name: Build

# Builds the deck on every push and pull request (like Ultimate Geography's integrity check).
# Pushing a version tag (v1.1, ...) also creates a draft release with the .apkg attached;
# write the release notes on GitHub, then publish it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Build deck
        run: uv run python ap_physics_1/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: AP_Physics_1
          path: dist/AP_Physics_1.apkg

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '### New cards\n\n### Corrected cards\n\n### Other changes\n' > notes.md
          gh release create "$GITHUB_REF_NAME" dist/AP_Physics_1.apkg --draft --title "$GITHUB_REF_NAME" --notes-file notes.md
